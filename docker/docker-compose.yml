services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backups:/app/backups
    networks:
      - bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-moviebot}
      POSTGRES_USER: ${DB_USER:-moviebot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moviebot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Changed to 5433 to avoid port conflict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moviebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  # Database management UI (optional, dev only)
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - bot_network
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  bot_network:
    driver: bridge
